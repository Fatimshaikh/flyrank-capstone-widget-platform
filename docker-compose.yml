services:
  postgres:
    image: postgres:16-alpine
    container_name: widget_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget_admin
      POSTGRES_PASSWORD: widget_secret_pw
      POSTGRES_DB: widget_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
